name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: qalyvyron-build-${{ github.sha }}
  cancel-in-progress: false

jobs:
  linux-qt-build:
    name: Linux / Qt 6 build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Qt and build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            cmake ninja-build g++ \
            qt6-base-dev qt6-declarative-dev \
            qt6-quick3d-dev qt6-quick3d-dev-tools qt6-shadertools-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 2

      - name: Run project I/O tests
        run: ctest --test-dir build --output-on-failure

  windows-portable-build:
    name: Windows x64 / portable package
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up the MSVC build environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qtquick3d qtshadertools qtquicktimeline'
          cache: true

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 2

      - name: Run project I/O tests
        run: ctest --test-dir build --output-on-failure

      - name: Stage portable application
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix "$PWD/dist"
          windeployqt --release --qmldir qml "$PWD/dist/bin/QALYVYRON.exe"
          Copy-Item README.md "$PWD/dist/README.md"
          Copy-Item ROADMAP.md "$PWD/dist/ROADMAP.md"

      - name: Launch the packaged application
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist/bin/QALYVYRON.exe"
          $stdout = Join-Path $PWD "qalyvyron-startup.stdout.log"
          $stderr = Join-Path $PWD "qalyvyron-startup.stderr.log"
          $env:QALYVYRON_LOG_FILE = Join-Path $PWD "qalyvyron-startup.log"
          $process = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden `
            -WorkingDirectory (Split-Path $exe) `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Start-Sleep -Seconds 8
          $process.Refresh()
          if ($process.HasExited) {
            Write-Host "Application stdout:"
            if (Test-Path $stdout) { Get-Content $stdout }
            Write-Host "Application stderr:"
            if (Test-Path $stderr) { Get-Content $stderr }
            Write-Host "Application diagnostic log:"
            if (Test-Path $env:QALYVYRON_LOG_FILE) { Get-Content $env:QALYVYRON_LOG_FILE }
            throw "QALYVYRON exited during the Windows startup smoke test (exit code $($process.ExitCode))."
          }
          Stop-Process -Id $process.Id -Force
          Write-Host "QALYVYRON stayed running through the startup smoke test."

      - name: Package portable application
        shell: pwsh
        run: |
          Compress-Archive -Path "$PWD/dist/bin/*" -DestinationPath "$PWD/QALYVYRON-Windows-x64.zip" -Force

      - name: Upload Windows portable package
        uses: actions/upload-artifact@v4
        with:
          name: QALYVYRON-Windows-x64
          path: QALYVYRON-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
